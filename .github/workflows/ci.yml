name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - src/tf/**
      - .github/workflows/**

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ github.event_name != 'pull_request' || steps.changed-files.outputs.any_changed == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            src/tf/**
            .github/workflows/**

  validate:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    uses: glitchedmob/infra-gha/.github/workflows/tf-validate.yml@v0.7.4
    with:
      init-backend: false

  terraform-checks:
    name: Terraform checks
    if: always()
    needs: [changes, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe
        with:
          allowed-skips: validate
          jobs: ${{ toJSON(needs) }}
